name: Publish

on:
  release:
    types: [published]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/betterlytics-selfhost

jobs:
  # Each platform builds on its own native runner and pushes by digest; merge tags them only when both succeed
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            cache: buildcache
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            cache: buildcache-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Load mock environment variables
        run: |
          cp .env.production.example ./dashboard/.env.build

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: selfhost_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Building selfhost image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.selfhost
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.selfhost_meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:${{ matrix.cache }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:${{ matrix.cache }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: selfhost_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Never move :latest - legacy checkouts pull it but can't boot newer images
          flavor: |
            latest=false

      - name: Publishing multi-platform selfhost image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspecting published image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.selfhost_meta.outputs.version }}
