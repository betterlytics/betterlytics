[advisories]
ignore = [
    # maxminddb `Reader::open_mmap` unsoundly marks the mmap as safe. We never
    # use open_mmap (only open_readfile/from_source, see src/geoip*); fixing
    # requires the 0.27 breaking lookup-API change. Revisit on the next
    # maxminddb bump.
    "RUSTSEC-2025-0132",
    # The three below are rustls-webpki 0.101.7, pulled in solely by the EOL
    # rustls 0.21 legacy connector that aws-smithy-http-client still ships as
    # a default feature. Our AWS client uses the rustls 0.23 + aws-lc path
    # (behavior-version-latest default), so the 0.101 code is compiled but not
    # exercised. No patched 0.101.x exists; drop these once smithy removes the
    # legacy rustls 0.21 connector.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]
